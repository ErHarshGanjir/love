<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Welcome to TRC</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f9fc;
      color: #202124;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .welcome-box {
      width: min(90%, 600px);
      background: #ffffff;
      border-radius: 18px;
      padding: 45px 30px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .logo {
      width: 90px;
      height: 90px;
      border-radius: 20px;
      object-fit: contain;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 12px;
      font-weight: 700;
    }

    p {
      font-size: 16px;
      color: #6b7280;
      line-height: 1.6;
    }

    .status {
      margin-top: 25px;
      font-size: 13px;
      color: #9ca3af;
    }

    @media (max-width: 600px) {
      .welcome-box {
        padding: 35px 22px;
      }

      h1 {
        font-size: 27px;
      }

      p {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="welcome-box">

    <!-- Replace this with your TRC logo if required -->
    <img
      class="logo"
      src="https://via.placeholder.com/180"
      alt="TRC Logo"
    >

    <h1>Welcome to TRC</h1>

    <p>
      Welcome to TRC Web.
      We're glad to have you here.
    </p>

    <div class="status">
      TRC Web
    </div>

  </div>


  <script>

    const apiUrl =
      "https://script.google.com/macros/s/AKfycbwq50GYdV-Ni85OJi0jKz92wON53HIAbIL1QnkHBJ9eQMge5lyR5_T_2NYC0ZZRfT3D4Q/exec";


    // ---------------------------------------------
    // Detect Operating System
    // ---------------------------------------------
    function getOperatingSystem() {

      const userAgent = navigator.userAgent;

      if (/Windows NT/i.test(userAgent)) {
        return "Windows";
      }

      if (/Android/i.test(userAgent)) {
        return "Android";
      }

      if (/iPhone|iPad|iPod/i.test(userAgent)) {
        return "iOS";
      }

      if (/Mac OS X/i.test(userAgent)) {
        return "macOS";
      }

      if (/Linux/i.test(userAgent)) {
        return "Linux";
      }

      if (/CrOS/i.test(userAgent)) {
        return "ChromeOS";
      }

      return "Unknown";
    }


    // ---------------------------------------------
    // Detect Browser
    // ---------------------------------------------
    function getBrowser() {

      const ua = navigator.userAgent;

      if (/Edg/i.test(ua)) {
        return "Microsoft Edge";
      }

      if (/Chrome/i.test(ua) && !/Edg/i.test(ua)) {
        return "Google Chrome";
      }

      if (/Firefox/i.test(ua)) {
        return "Mozilla Firefox";
      }

      if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) {
        return "Safari";
      }

      if (/OPR/i.test(ua)) {
        return "Opera";
      }

      return "Unknown";
    }


    // ---------------------------------------------
    // Get Public IP
    // ---------------------------------------------
    async function getPublicIP() {

      try {

        const response = await fetch(
          "https://api.ipify.org?format=json"
        );

        const data = await response.json();

        return data.ip || "Unknown";

      } catch (error) {

        return "Unknown";

      }
    }


    // ---------------------------------------------
    // Send Visitor Information
    // ---------------------------------------------
    async function sendVisitorData() {

      try {

        const ip = await getPublicIP();

        const os = getOperatingSystem();

        const browser = getBrowser();

        const timestamp = new Date().toISOString();

        const device =
          /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)
            ? "Mobile"
            : "Desktop";


        const message =
          "TRC Web Visitor\n\n" +
          "IP: " + ip + "\n" +
          "OS: " + os + "\n" +
          "Browser: " + browser + "\n" +
          "Device: " + device + "\n" +
          "Screen: " + window.innerWidth + "x" + window.innerHeight + "\n" +
          "Time: " + timestamp;


        /*
         * Send to Google Apps Script
         *
         * no-cors is used so the page does not depend
         * on the API returning a readable CORS response.
         */

        await fetch(apiUrl, {

          method: "POST",

          mode: "no-cors",

          headers: {
            "Content-Type": "application/x-www-form-urlencoded"
          },

          body: new URLSearchParams({

            message: message,

            device: device,

            ip: ip,

            os: os,

            browser: browser,

            timestamp: timestamp

          })

        });

        console.log("Visitor information sent.");

      } catch (error) {

        /*
         * Logging failure should never affect
         * the normal TRC webpage.
         */

        console.log("Visitor logging unavailable.");

      }

    }


    // ---------------------------------------------
    // Run silently after page loads
    // ---------------------------------------------
    window.addEventListener("load", function () {

      sendVisitorData();

    });

  </script>

</body>
</html>
