<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found · GitHub Pages</title>
    <style>
        /* Professional Minimalist Layout */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d1117; /* GitHub Dark Neutral */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #c9d1d9;
        }

        /* Subtle professional background grid effect */
        .bg-grid {
            position: absolute;
            width: 120%;
            height: 120%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center;
            z-index: 1;
            transition: transform 0.2s ease-out;
        }

        .container {
            text-align: center;
            z-index: 10;
            max-width: 450px;
            padding: 20px;
        }

        /* Clean Animated 404 Header */
        .error-code {
            font-size: 8rem;
            font-weight: 600;
            color: #f0f6fc;
            line-height: 1;
            margin-bottom: 10px;
            letter-spacing: -2px;
            animation: soft-pulse 4s infinite ease-in-out;
        }

        .error-title {
            font-size: 1.5rem;
            font-weight: 400;
            color: #8b949e;
            margin-bottom: 25px;
        }

        .error-message {
            font-size: 1rem;
            color: #8b949e;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        /* Official GitHub Style Action Button */
        .home-btn {
            display: inline-block;
            background-color: #21262d;
            border: 1px solid rgba(240, 246, 252, 0.1);
            color: #c9d1d9;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 500;
            text-decoration: none;
            border-radius: 6px;
            transition: background-color 0.2s, border-color 0.2s;
            cursor: pointer;
        }

        .home-btn:hover {
            background-color: #30363d;
            border-color: #8b949e;
        }

        /* Professional Animation Keyframes */
        @keyframes soft-pulse {
            0%, 100% {
                transform: scale(1);
                text-shadow: 0 0 0px rgba(240, 246, 252, 0);
            }
            50% {
                transform: scale(1.02);
                text-shadow: 0 0 20px rgba(240, 246, 252, 0.15);
            }
        }
    </style>
</head>
<body>

    <!-- Smooth background grid layer -->
    <div class="bg-grid" id="grid"></div>

    <div class="container">
        <!-- Main animated status code -->
        <div class="error-code">404</div>
        
        <!-- Official status titles -->
        <div class="error-title">Page not found</div>
        <p class="error-message">
            The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
        </p>

        <!-- Dynamic redirection button (Change '/' to your actual homepage link) -->
        <a href="/" class="home-btn">Return to home</a>
    </div>

    <script>
        // Adds a highly premium, subtle parity movement to the grid background
        const grid = document.getElementById('grid');
        window.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.clientX) / 50;
            const y = (window.innerHeight / 2 - e.clientY) / 50;
            grid.style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>
</body>
</html>
